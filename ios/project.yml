# Generate Seamstress.xcodeproj with: brew install xcodegen && xcodegen
name: Seamstress
options:
  bundleIdPrefix: io.github.be-to-mu
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Seamstress:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources: [Seamstress]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Seamstress/Info.plist
      properties:
        CFBundleDisplayName: Seamstress
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit]
        NSPhotoLibraryUsageDescription: Seamstress uses photos you pick as references for a garment design.
        NSMicrophoneUsageDescription: Seamstress listens when you hold Ask, so you can ask questions about your fitting.
        NSSpeechRecognitionUsageDescription: Your question is turned into text on the phone so the assistant can answer it.
        ElevenLabsAPIKey: $(ELEVENLABS_API_KEY)
        ElevenLabsVoiceID: $(ELEVENLABS_VOICE_ID)
        GeminiAPIKey: $(GEMINI_API_KEY)
        GeminiModel: $(GEMINI_MODEL)
        NSCameraUsageDescription: Seamstress uses the camera and LiDAR to make a 3D model of your body.
        NSMotionUsageDescription: Seamstress uses the motion sensors to know which way is down while scanning.
